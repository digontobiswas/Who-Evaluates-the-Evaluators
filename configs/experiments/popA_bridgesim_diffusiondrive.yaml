# DiffusionDrive in BridgeSim (421 NavHard scenarios): held-out base for Population A and a
# Population B policy, with BridgeSim's own DiffusionDrive adapter. Same protocol as the other
# policies; the published leaderboard value (DS 43.29) is compared for the clean run.
#   OVERRIDES="degradation.name=latency degradation.level=2"

extends:
  - popA_bridgesim_navhard.yaml

policy:
  family: diffusiondrive
  seed: 0
  id: diffusiondrive_seed0
  checkpoint: ${paths.checkpoints}/diffusiondrive/diffusiondrive_navsim_88p1_PDMS
  plan_anchor: ${paths.checkpoints}/diffusiondrive/kmeans_navsim_traj_20.npy
  bridgesim_args: ["--plan-anchor-path", "${policy.plan_anchor}"]

degradation:
  wrap: true
