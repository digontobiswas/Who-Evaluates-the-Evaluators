# BridgeSim (CoRL 2026): closed-loop evaluation of NAVSIM policies in MetaDrive, on OpenScene
# scenarios converted to ScenarioNet format. Code pinned in configs/third_party.env.

evaluator:
  id: bridgesim_closed_loop
  family: closed_loop
  root: ${paths.third_party}/bridgesim

  # Inputs already on disk from the NAVSIM setup: OpenScene "test" logs and nuPlan maps.
  navsim_log_path: ${paths.openscene}/navsim_logs/test
  map_root: ${paths.maps}

  # NavHard is a filter over the OpenScene test split (BridgeSim ships the filter).
  scene_filter: ${evaluator.root}/converters/openscene/filter/navhard_two_stage.yaml
  conversion:
    num_future_frames_extract: 40     # BridgeSim README, NavHard quick start
    interpolate: true                 # 2 Hz -> 10 Hz, required for closed loop

  # BridgeSim-NavHard leaderboard protocol (README): replanning at 2 Hz, 8 s scored after a
  # 2 s log-replay warm-up, logged traffic, no domain adaptation.
  run:
    eval_mode: closed_loop
    traffic_mode: log_replay
    controller: pure_pursuit
    sim_dt: 0.1
    replan_rate: 5
    ego_replay_frames: 20
    eval_frames: 80

  # Published values to reproduce on all 421 NavHard scenarios. Do not edit to match a result.
  reference:
    source: "BridgeSim README at ea5d45f, BridgeSim-NavHard leaderboard (421 scenarios)"
    transfuser: {epdms: 68.17, ds: 41.46, rc: 61.28}
    ltf: {epdms: 69.29, ds: 50.10, rc: 70.64}
