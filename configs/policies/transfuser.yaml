# TransFuser baseline of NAVSIM (camera + LiDAR + ego status), trained on navtrain.
# Weights: https://huggingface.co/autonomousvision/navsim_baselines (Apache-2.0), 3 training seeds.

policy:
  family: transfuser
  seed: 0                                    # 0, 1 or 2
  id: transfuser_seed${policy.seed}
  navsim_agent: transfuser_agent
  # Hydra agent config used when the policy is degraded (configs/navsim_hydra/v1/agent/).
  degraded_agent: degraded_transfuser_agent
  navsim_overrides:
    - agent.config.latent=false
  checkpoint: ${paths.checkpoints}/navsim_baselines/transfuser/transfuser_seed_${policy.seed}.ckpt

  # The agent's sensor config (SensorConfig.build_all_sensors(include=[3])) loads all eight
  # cameras and the merged LiDAR sweep for the current frame only, so all of those files must
  # be on disk. The model itself uses the three front cameras, stitched, plus the LiDAR.
  sensors:
    cameras: [cam_f0, cam_l0, cam_l1, cam_l2, cam_r0, cam_r1, cam_r2, cam_b0]
    used_cameras: [cam_l0, cam_f0, cam_r0]
    lidar: true
    history_frames: 1

  # Published value this checkpoint family is checked against. Do not edit to match a result.
  reference:
    pdms: 84.0
    submetrics: {NC: 97.7, DAC: 92.8, TTC: 92.8, Comfort: 100.0, EP: 79.2}
    source: "NAVSIM paper, arXiv:2406.15349v2, Table 1 (navtest)"
    note: >-
      The paper reports a standard deviation of 0.56 PDMS across three TransFuser training seeds,
      and the model card says the leaderboard was populated with three seeds per model. A single
      seed can therefore sit about half a point from 84.0; the three-seed mean is the fairer check.
