paths:
  repo: /scratch/scratch26/biswabandhurj/wete
  root: /scratch/scratch26/biswabandhurj/wete_work
  data: /scratch/scratch26/biswabandhurj/wete_work/data
  exp: /scratch/scratch26/biswabandhurj/wete_work/exp
  checkpoints: /scratch/scratch26/biswabandhurj/wete_work/checkpoints
  third_party: /scratch/scratch26/biswabandhurj/wete_work/third_party
  openscene: /scratch/scratch26/biswabandhurj/wete_work/data/openscene
  maps: /scratch/scratch26/biswabandhurj/wete_work/data/openscene/maps
navsim:
  map_version: nuplan-maps-v1.0
workers: 40
degradation:
  name: tail_lateral
  level: 2
  value: null
  wrap: true
evaluator:
  id: navsim_v1_pdms
  family: pseudo_sim_v1
  devkit_root: /scratch/scratch26/biswabandhurj/wete_work/third_party/navsim_v1
  nuplan_devkit_root: /scratch/scratch26/biswabandhurj/wete_work/third_party/nuplan-devkit
  split: navtest
  navsim_log_path: /scratch/scratch26/biswabandhurj/wete_work/data/openscene/navsim_logs/test
  sensor_blobs_path: /scratch/scratch26/biswabandhurj/wete_work/data/openscene/sensor_blobs/test
  metric_cache:
    dir: /scratch/scratch26/biswabandhurj/wete_work/exp/metric_cache/navsim_v1_navtest
    worker:
      name: ray_distributed_no_torch
  scoring:
    worker:
      name: single_machine_thread_pool
      use_process_pool: false
policy:
  family: diffusiondrive
  seed: 0
  id: diffusiondrive_seed0
  navsim_agent: diffusiondrive_agent
  degraded_agent: degraded_diffusiondrive_agent
  navsim_overrides:
  - agent.config.plan_anchor_path=/scratch/scratch26/biswabandhurj/wete_work/checkpoints/diffusiondrive/kmeans_navsim_traj_20.npy
  checkpoint: /scratch/scratch26/biswabandhurj/wete_work/checkpoints/diffusiondrive/diffusiondrive_navsim_88p1_PDMS
  plan_anchor: /scratch/scratch26/biswabandhurj/wete_work/checkpoints/diffusiondrive/kmeans_navsim_traj_20.npy
  bridgesim_args:
  - --plan-anchor-path
  - /scratch/scratch26/biswabandhurj/wete_work/checkpoints/diffusiondrive/kmeans_navsim_traj_20.npy
  sensors:
    cameras:
    - cam_f0
    - cam_l0
    - cam_l1
    - cam_l2
    - cam_r0
    - cam_r1
    - cam_r2
    - cam_b0
    used_cameras:
    - cam_l0
    - cam_f0
    - cam_r0
    lidar: true
    history_frames: 1
  reference:
    pdms: 88.1
    source: DiffusionDrive README (hustvl/DiffusionDrive at 9b52ed0), navtest PDMS,
      with per-token CSV diffusiondrive_88p1_PDMS.csv
    note: The diffusion sampler draws Gaussian noise; the wrapper seeds it per scenario
      token, so our runs are repeatable but need not match the authors' draws token
      by token.
experiment:
  name: popA_diffusiondrive_seed0_tail_lateral_L2_navtest
  out_dir: /scratch/scratch26/biswabandhurj/wete_work/exp/runs/navsim_v1/A/diffusiondrive_seed0/tail_lateral__L2
  export_dir: /scratch/scratch26/biswabandhurj/wete/results/popA/diffusiondrive_seed0/tail_lateral__L2
scenarios:
  mode: full
